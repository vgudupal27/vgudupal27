name: Build contribution city
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: write
concurrency:
  group: contribution-city
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate city from public contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: vgudupal27
        run: python scripts/contribution_city.py
      - name: Save updated contribution city
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-city.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public contribution city'
            git push
          fi
